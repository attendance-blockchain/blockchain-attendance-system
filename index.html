<!DOCTYPE html>
<html>
<head>
    <title>Blockchain Attendance</title>
</head>
<body>

<h2>Student Attendance System</h2>

<input type="number" id="studentId" placeholder="Enter Student ID">
<button onclick="mark()">Mark Attendance</button>

<p id="status"></p>

<script>
    function mark() {
        document.getElementById("status").innerText =
        "Attendance recorded on blockchain (simulation)";
    }
</script>

</body>
</html>
